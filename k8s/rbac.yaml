apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudpilot
  namespace: cloudpilot
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudpilot
  namespace: cloudpilot
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudpilot
  namespace: cloudpilot
subjects:
  - kind: ServiceAccount
    name: cloudpilot
    namespace: cloudpilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudpilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudpilot-node-reader
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudpilot-node-reader
subjects:
  - kind: ServiceAccount
    name: cloudpilot
    namespace: cloudpilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudpilot-node-reader
